<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Old Brads · Plataforma</title>

    <!-- Instalable en el teléfono: los jugadores la agregan a la pantalla de
         inicio y la abren como app, sin barra del navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c244c" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Old Brads" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Solo en producción: en desarrollo un service worker sirve versiones
      // viejas y uno termina depurando un archivo que ya no existe.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}))
      }
    </script>
  </body>
</html>
